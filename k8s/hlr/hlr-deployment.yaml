apiVersion: apps/v1
kind: Deployment
metadata:
  name: hlr-app
  labels:
    app: hlr-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hlr-app
  template:
    metadata:
      labels:
        app: hlr-app
    spec:
      containers:
        - name: hlr-app
          image: olakouns/hlr-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8092
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: mysql-root-password
            - name: DB_SERVER
              valueFrom:
                configMapKeyRef:
                  name:  mysql-config-map
                  key: mysql-hlr-server
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name:  mysql-config-map
                  key: mysql-database-hlr-name
            - name: DB_USERNAME
              value: root
---
apiVersion: v1
kind: Service
metadata:
  name: hlr-app
  labels:
    app: hlr-app
spec:
  type: NodePort
  selector:
    app: hlr-app
  ports:
    - protocol: TCP
      name: http
      port: 8092
      targetPort: 8092
      nodePort: 30090