apiVersion: apps/v1
kind: Deployment
metadata:
  name: in-app
  labels:
    app: in-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: in-app
  template:
    metadata:
      labels:
        app: in-app
    spec:
      containers:
        - name: in-app
          image: olakouns/in-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8091
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-pass
                  key: mysql-root-password
            - name: DB_SERVER
              valueFrom:
                configMapKeyRef:
                  name:  mysql-config-map
                  key: mysql-in-server
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name:  mysql-config-map
                  key: mysql-database-in-name
            - name: DB_USERNAME
              value: root
---
apiVersion: v1
kind: Service
metadata:
  name: in-app
  labels:
    app: in-app
spec:
  type: NodePort
  selector:
    app: in-app
  ports:
    - protocol: TCP
      name: http
      port: 8091
      targetPort: 8091
      nodePort: 30080